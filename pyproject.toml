[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "docbin"
version = "1.0.0"
description = "Historical document restoration and binarization service"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Document Restoration Team" }
]
dependencies = [
    "numpy>=1.24.0",
    "opencv-python-headless>=4.8.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "python-multipart>=0.0.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "httpx>=0.24.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
